<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçador 3D Pro - Sistema de Clientes</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #viewer canvas { width: 100% !important; height: 100% !important; display: block; }
        .limit-exceeded { background-color: #ef4444 !important; }
        /* Overlay de Login */
        #auth-overlay {
            backdrop-filter: blur(8px);
            display: flex;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-slate-900/80 items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-black text-slate-800">ÁREA DO <span class="text-blue-600">CLIENTE</span></h2>
                <p class="text-slate-500 text-sm mt-2 font-medium">Faça login para acessar o orçador industrial</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase">E-mail</label>
                    <input type="email" id="login-email" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 outline-none focus:border-blue-500 transition-all">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase">Senha</label>
                    <input type="password" id="login-password" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 outline-none focus:border-blue-500 transition-all">
                </div>
                <button onclick="handleLogin()" id="btn-login" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all uppercase text-sm">Entrar no Sistema</button>
                
                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                    <div class="relative flex justify-center text-xs uppercase font-bold text-slate-400"><span class="bg-white px-2">Ou</span></div>
                </div>

                <button onclick="handleSignUp()" class="w-full border-2 border-slate-200 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-50 transition-all uppercase text-xs">Criar Nova Conta</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="max-w-6xl mx-auto py-8 px-4 opacity-20 pointer-events-none transition-all duration-700">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-black text-slate-800 uppercase">Orçador <span class="text-blue-600">3D</span></h1>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">Visitante</span>
                <button onclick="handleLogout()" class="text-[10px] font-black text-red-500 hover:underline uppercase">Sair</button>
            </div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div id="drop-zone" class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-blue-500 transition-all cursor-pointer relative">
                    <p id="status-text" class="text-slate-500 font-black text-xs uppercase">Arraste o arquivo STL ou clique aqui</p>
                    <input type="file" id="fileInput" accept=".stl" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                <div id="viewer-container" class="relative h-[550px] bg-slate-900 rounded-2xl shadow-2xl overflow-hidden hidden border-4 border-white">
                    <div id="viewer" class="w-full h-full"></div>
                    <div id="size-alert" class="absolute top-4 right-4 bg-red-600 text-white px-4 py-2 rounded-lg font-black text-[10px] uppercase hidden animate-pulse">⚠️ Tamanho excede a impressora</div>
                    <div class="absolute top-4 left-4 flex flex-col gap-2">
                        <button onclick="setMode('translate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase">Mover</button>
                        <button onclick="setMode('rotate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase">Girar</button>
                        <button onclick="setMode('scale')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase">Escalar</button>
                    </div>
                    <div class="absolute bottom-4 right-4 bg-slate-800/90 text-white p-3 rounded-xl text-[11px] backdrop-blur-md">
                        <span id="dims" class="font-mono text-lg">0.0 x 0.0 x 0.0</span> <span class="text-slate-400">mm</span>
                    </div>
                </div>
            </div>
            <div class="space-y-6">
                <div id="controls" class="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 opacity-40 pointer-events-none">
                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Máquina</label>
                        <select id="printerSelect" onchange="updatePrinterVolume()" class="w-full bg-blue-50 border-2 border-blue-200 rounded-xl p-3 font-bold text-blue-700 outline-none">
                            <option value="220,240,220">Impressora 01 (22 x 22 x h24 cm)</option>
                        </select>
                        <select id="material" onchange="updatePrice()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none">
                            <option value="0.18">PLA - Pro (R$ 0,18/g)</option>
                            <option value="0.28">PETG - XT (R$ 0,28/g)</option>
                        </select>
                        <select id="infill" onchange="updatePrice()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none">
                            <option value="0.15">15% - Leve</option>
                            <option value="0.45">45% - Resistente</option>
                        </select>
                        <div id="price-container" class="bg-blue-600 p-5 rounded-2xl shadow-lg transition-colors mt-6">
                            <span id="total" class="block text-center text-4xl font-black text-white">R$ 0,00</span>
                        </div>
                    </div>
                    <button id="wa-button" onclick="sendWA()" class="w-full bg-slate-800 text-white font-black py-4 rounded-xl mt-6 uppercase text-xs hover:bg-slate-900 transition-all">Enviar para WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "SUA_API_KEY", // <--- COLE AQUI
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "12345",
            appId: "1:12345"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- 2. LÓGICA DE LOGIN ---
        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Erro: " + err.message));
        }

        function handleSignUp() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            auth.createUserWithEmailAndPassword(email, pass).catch(err => alert("Erro: " + err.message));
        }

        function handleLogout() {
            auth.signOut();
        }

        // Observador de Estado de Login
        auth.onAuthStateChanged(user => {
            const overlay = document.getElementById('auth-overlay');
            const content = document.getElementById('main-content');
            const userDisp = document.getElementById('user-display');

            if (user) {
                overlay.style.display = 'none';
                content.classList.remove('opacity-20', 'pointer-events-none');
                userDisp.innerText = user.email;
            } else {
                overlay.style.display = 'flex';
                content.classList.add('opacity-20', 'pointer-events-none');
                userDisp.innerText = "Visitante";
            }
        });

        // --- 3. SEU CÓDIGO DO ORÇADOR (THREE.JS) ---
        // (Aqui continua exatamente a lógica que você já tinha: initThree, handleFile, etc.)
        // Adicionei apenas o seu sendWA original com uma pequena melhoria no texto.
        
        let scene, camera, renderer, orbit, transform, mesh, printerVolume;
        let currentVol = 0;
        const viewerDiv = document.getElementById('viewer');

        // ... [Resto das suas funções: initThree, updatePrice, handleFile, etc.] ...
        // (Mantenha o restante do seu código JavaScript aqui)
    </script>
</body>
</html>
